[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "victron-trends"
version = "0.1.2"
description = "Read the Trends history stored on Victron SmartShunts and SmartSolar chargers over BLE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
test = ["pytest>=8"]

[project.scripts]
victron-trends = "victron_trends.__main__:main"

[project.urls]
Repository = "https://github.com/edilAraujo/victron-trends"

[tool.setuptools]
packages = ["victron_trends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
